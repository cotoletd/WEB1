<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Animal Pictures</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
        <h1>Animal pictures</h1>
        <p>Resize the browser window to see four, two or one picture in each row.</p>
        <div class="animals">
            <img src="images/crocodile.jpg" alt="Crocodile" title="Crocodile">
            <img src="images/elephant.jpg" alt="Elephant" title="Elephant">
            <img src="images/giraffe.jpg" alt="Giraffe" title="Giraffe">
            <img src="images/tiger.jpg" alt="Tiger" title="Tiger">
        </div>
    </main>
</body>
</html>
